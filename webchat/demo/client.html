<!doctype html>
<!--
  client.html — minimal chat UI implementing the demo protocol.

  Protocol it speaks:
    out: {type:"keystroke", prompt, seq}  on each debounced input change
    out: {type:"enter", prompt, seq}      on Enter
    in : {type:"hello", client_id}
    in : {type:"speculation"|"authoritative", prompt, completion, infer_ms}
    in : {type:"blit_ok", prompt}         server confirms a fresh blit

  The magic: each keystroke (debounced ~50ms client-side too, to match the
  server) fires a speculation; the latest completion is BUFFERED. On Enter we
  blit the buffer locally with no round trip IF it matches the exact current
  input (freshness). If it doesn't, we wait for the authoritative completion the
  server fires. A tiny latency readout shows speculation round-trip ms so you can
  watch the magic hold or break.
-->
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kevin on Kria — live</title>
<style>
 :root{color-scheme:dark}
 body{margin:0;font-family:system-ui,sans-serif;background:#0d1117;color:#e6edf3;
      display:flex;flex-direction:column;height:100vh}
 header{padding:12px 16px;background:#161b22;border-bottom:1px solid #30363d;
        font-weight:600;display:flex;justify-content:space-between;align-items:center}
 header small{font-weight:400;color:#8b949e}
 #log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:6px}
 .msg{max-width:80%;padding:9px 13px;border-radius:14px;line-height:1.45;white-space:pre-wrap}
 .you{align-self:flex-end;background:#1f6feb;color:#fff;border-bottom-right-radius:4px;margin-top:8px}
 .kev{align-self:flex-start;background:#21262d;border:1px solid #30363d;border-bottom-left-radius:4px}
 #spec{align-self:flex-start;color:#8b949e;font-style:italic;font-size:13px;min-height:18px;padding-left:6px}
 .meta{align-self:flex-start;font-size:11px;color:#8b949e;font-variant-numeric:tabular-nums;padding-left:6px}
 .meta b{color:#3fb950}
 form{display:flex;gap:8px;padding:12px 16px;background:#161b22;border-top:1px solid #30363d}
 input[type=text]{flex:1;padding:11px 13px;border-radius:10px;border:1px solid #30363d;
      background:#0d1117;color:#e6edf3;font-size:15px}
 button{padding:11px 18px;border:0;border-radius:10px;background:#238636;color:#fff;font-weight:600;cursor:pointer}
</style></head><body>
<header>
 <span>🧒 Kevin <small>on Kria · speculative · <span id="status">connecting…</span></small></span>
 <span class="meta" id="lat">spec —</span>
</header>
<div id="log">
 <div class="msg kev">few word do trick. type thing. me finish it. (answer shows up before you hit enter.)</div>
</div>
<div id="spec"></div>
<form id="f" onsubmit="return onEnter(event)">
 <input id="p" type="text" autocomplete="off" placeholder="once upon time..." autofocus>
 <button type="submit">Send</button>
</form>
<script>
const log=document.getElementById('log'), inp=document.getElementById('p'),
      specEl=document.getElementById('spec'), statusEl=document.getElementById('status'),
      latEl=document.getElementById('lat');
const DEBOUNCE_MS=50;
let ws, seq=0, debTimer=null;
// the speculation buffer: completion the server computed for `bufPrompt`.
let bufPrompt=null, bufCompletion=null;
let lastSentAt=0, lastSentPrompt=null;

function add(cls,txt){const d=document.createElement('div');d.className='msg '+cls;
 d.textContent=txt||'';log.appendChild(d);log.scrollTop=log.scrollHeight;return d;}

function connect(){
 const proto=location.protocol==='https:'?'wss':'ws';
 const url=(window.WS_URL)||(proto+'://'+location.host);
 ws=new WebSocket(url);
 ws.onopen=()=>{statusEl.textContent='live';};
 ws.onclose=()=>{statusEl.textContent='disconnected';setTimeout(connect,1500);};
 ws.onmessage=(ev)=>{
   const m=JSON.parse(ev.data);
   if(m.type==='hello'){statusEl.textContent='live · '+m.client_id;}
   else if(m.type==='speculation'||m.type==='authoritative'){
     bufPrompt=m.prompt; bufCompletion=m.completion;
     if(m.prompt===lastSentPrompt&&lastSentAt){
       latEl.innerHTML='spec <b>'+Math.round(performance.now()-lastSentAt)+' ms</b>';
     }
     // show the live speculation under the input (the "before you finish" trick)
     if(m.prompt===inp.value.trim()){specEl.textContent='▍ '+m.completion;}
     if(m.type==='authoritative'){ // a freshness miss was resolved -> render it
       blit(m.prompt, m.completion, true);
     }
   } else if(m.type==='blit_ok'){ /* server agreed; we already blitted */ }
 };
}

function sendKeystroke(){
 const p=inp.value.trim(); if(!p)return;
 seq++; lastSentPrompt=p; lastSentAt=performance.now();
 ws.send(JSON.stringify({type:'keystroke',prompt:p,seq:seq}));
}

inp.addEventListener('input',()=>{
 clearTimeout(debTimer);
 debTimer=setTimeout(sendKeystroke,DEBOUNCE_MS);
});

function blit(prompt, completion, authoritative){
 add('you',prompt);
 add('kev',completion);
 add('meta', authoritative?'authoritative (freshness miss → 1 round trip)':'blitted from buffer · 0 round trip');
 inp.value=''; specEl.textContent=''; bufPrompt=null; bufCompletion=null;
 log.scrollTop=log.scrollHeight;
}

function onEnter(e){
 e.preventDefault();
 const cur=inp.value.trim(); if(!cur)return false;
 seq++;
 ws.send(JSON.stringify({type:'enter',prompt:cur,seq:seq}));
 // freshness check, client side: blit only if the buffer matches EXACTLY.
 if(bufPrompt===cur && bufCompletion!=null){
   blit(cur, bufCompletion, false);     // 0 round trip
 } else {
   // stale/absent -> wait for the server's authoritative completion (it fires one)
   add('you',cur); inp.value=''; specEl.textContent='';
   const wait=add('kev','…'); wait.dataset.waiting='1';
 }
 return false;
}
connect();
</script></body></html>
